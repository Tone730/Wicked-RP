<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="24" fill="#0b0c0e" stroke="#24262b" stroke-width="2"/>
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- RP letters -->
  <text x="50" y="74" font-family="Arial, sans-serif" font-weight="bold" font-size="40" fill="#7c3aed" text-anchor="middle">RP</text>
  <!-- Small dot (live indicator) -->
  <circle cx="98" cy="30" r="5" fill="#22c55e"/>
</svg>
